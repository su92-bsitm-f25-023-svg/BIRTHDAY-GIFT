
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    overflow-x: hidden;
    text-align: center;
    padding: 20px;
}

.container {
    background: rgba(255,255,255,0.85);
    padding: 40px 25px;
    border-radius: 25px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff4081;
    font-size: 2.5rem;
    margin-bottom: 15px;
    animation: bounce 2s infinite;
}

.name {
    color: #9c27b0;
    font-size: 2rem;
    font-weight: bold;
    margin: 15px 0;
}

.cake {
    font-size: 90px;
    margin: 20px 0;
    animation: float 2s ease-in-out infinite;
}

.message {
    color: #555;
    font-size: 17px;
    line-height: 1.7;
    margin: 15px 0 25px;
}

button {
    background: linear-gradient(45deg, #ff4081, #9c27b0);
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    margin: 8px;
}

button:hover {
    transform: scale(1.08);
}

#surprise {
    display: none;
    color: #e91e63;
    font-size: 19px;
    margin-top: 20px;
    line-height: 1.6;
    animation: fadeIn 1s;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: rise 6s linear infinite;
    z-index: 1;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 480px) {
    .container {
        padding: 30px 18px;
    }

    h1 {
        font-size: 2rem;
    }

    .name {
        font-size: 1.6rem;
    }

    .cake {
        font-size: 70px;
    }

    .message {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Happy Birthday! 🎉</h1>

    <div class="name">Dear Birthday Star 💖</div>

    <div class="cake">🎂</div>

    <p class="message">
        Wishing you a day filled with love, laughter,
        happiness and unforgettable memories.
        May all your dreams come true!
        Keep shining and smiling always. ✨
    </p>

    <button onclick="showSurprise()">
        🎁 Open Your Surprise
    </button>

    <div id="surprise">
        💕 You are special and deserve all the happiness
        in the world! Have the most amazing birthday ever!
        🌸🎀
    </div>
</div>

<script>
// Confetti animation
const colors = [
    "#ff4081", "#ffd700", "#9c27b0",
    "#00bcd4", "#ff9800", "#4caf50"
];

function createConfetti() {
    const confetti = document.createElement("div");

    confetti.style.position = "fixed";
    confetti.style.width = "10px";
    confetti.style.height = "10px";
    confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.top = "-15px";
    confetti.style.borderRadius = "2px";
    confetti.style.zIndex = "10";
    confetti.style.pointerEvents = "none";

    document.body.appendChild(confetti);

    const duration = Math.random() * 3 + 2;
    const drift = (Math.random() - 0.5) * 250;

    confetti.animate([
        { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
        { transform: `translate(${drift}px, 110vh) rotate(720deg)`,
          opacity: 0 }
    ], {
        duration: duration * 1000,
        easing: "linear"
    });

    setTimeout(() => confetti.remove(), duration * 1000);
}

// Continuous confetti
setInterval(createConfetti, 100);

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 700);

// Surprise message
function showSurprise() {
    document.getElementById("surprise").style.display = "block";

    for (let i = 0; i < 60; i++) {
        setTimeout(createConfetti, i * 25);
    }
}
</script>

</body>
</html>
